name: GPU CI and deploy gate
on:
  pull_request:
    paths: ['embedding/**', 'reranker/**', 'nli/**', 'models.json', 'deploy/**', '.github/workflows/**']
  push:
    branches: [main]
    paths: ['embedding/**', 'reranker/**', 'nli/**', 'models.json', 'deploy/**', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - run: for service in embedding reranker nli; do (cd "$service" && python -m unittest discover -p 'test_*.py'); done
      - run: python -m unittest discover -s deploy -p 'test_*.py'
  # No deploy job: manual dispatch runs tests only. Add deployment after runner,
  # units, pinned model provisioning, and authenticated functional readiness are verified.
