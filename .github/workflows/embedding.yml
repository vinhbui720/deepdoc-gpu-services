name: embedding checks
on:
  push:
    paths: ['embedding/**', '.github/workflows/embedding.yml']
  pull_request:
    paths: ['embedding/**', '.github/workflows/embedding.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - run: cd embedding && python -m unittest discover -p 'test_*.py'
