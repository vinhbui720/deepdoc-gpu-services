name: nli checks
on:
  push:
    paths: ['nli/**', '.github/workflows/nli.yml']
  pull_request:
    paths: ['nli/**', '.github/workflows/nli.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: cd nli && python -m unittest discover -p 'test_*.py'
