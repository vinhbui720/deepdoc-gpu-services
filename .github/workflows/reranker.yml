name: reranker checks
on:
  push:
    paths: ['reranker/**', '.github/workflows/reranker.yml']
  pull_request:
    paths: ['reranker/**', '.github/workflows/reranker.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: cd reranker && python -m unittest discover -p 'test_*.py'
